<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner circle highlight -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Main emblem -->
  <g filter="url(#shadow)">
    <!-- Calendar / Board Background -->
    <rect x="116" y="126" width="280" height="260" rx="36" fill="#ffffff" />
    
    <!-- Calendar Header (Blue) -->
    <path d="M 116 162 C 116 142.1 132.1 126 152 126 L 360 126 C 379.9 126 396 142.1 396 162 L 396 198 L 116 198 Z" fill="#2563eb" />
    
    <!-- Calendar binder rings -->
    <rect x="180" y="104" width="20" height="42" rx="10" fill="#cbd5e1" />
    <rect x="312" y="104" width="20" height="42" rx="10" fill="#cbd5e1" />
    
    <!-- Assembly / Gathering silhouette -->
    <!-- Center Person -->
    <circle cx="256" cy="242" r="22" fill="#1e3a8a" />
    <path d="M 226 312 C 226 280 286 280 286 312 Z" fill="#1e3a8a" />
    
    <!-- Left Person -->
    <circle cx="196" cy="256" r="17" fill="#64748b" />
    <path d="M 172 312 C 172 288 220 288 220 312 Z" fill="#64748b" />
    
    <!-- Right Person -->
    <circle cx="316" cy="256" r="17" fill="#64748b" />
    <path d="M 292 312 C 292 288 340 288 340 312 Z" fill="#64748b" />

    <!-- Growth / Stats indicator badge -->
    <circle cx="366" cy="356" r="44" fill="url(#goldGrad)" filter="url(#shadow)" />
    <path d="M 350 366 L 362 350 L 370 358 L 384 342" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 374 342 L 384 342 L 384 352" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
